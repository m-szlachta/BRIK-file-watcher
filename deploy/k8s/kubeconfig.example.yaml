# Template for secrets/kubeconfig (mounted into the dispatcher at /run/secrets/kubeconfig).
# Fill in with:
#   kubectl -n brik get secret brik2-dp-dispatcher-token -o jsonpath='{.data.token}' | base64 -d
#   kubectl -n brik get secret brik2-dp-dispatcher-token -o jsonpath='{.data.ca\.crt}'   # already base64
apiVersion: v1
kind: Config
clusters:
  - name: pcai
    cluster:
      server: https://pcai-api.example.local:6443
      certificate-authority-data: <base64 CA certificate>
users:
  - name: brik2-dp-dispatcher
    user:
      token: <service account token>
contexts:
  - name: brik2-dp-dispatcher
    context:
      cluster: pcai
      user: brik2-dp-dispatcher
      namespace: brik
current-context: brik2-dp-dispatcher
